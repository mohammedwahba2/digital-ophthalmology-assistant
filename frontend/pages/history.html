<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Full diagnosis history with filtering tools." />
  <title>Digital Ophthalmology Assistant | History</title>
  <link rel="stylesheet" href="../styles/styles.css" />
  <script defer src="../assets/icons.js"></script>
  <script defer src="../js/app.js"></script>
</head>
<body data-page="history">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html"><img src="../assets/doa_header_logo.svg" alt="Digital Ophthalmology Assistant" class="brand-logo" /></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation"><span class="icon" data-icon="settings"></span><span>Menu</span></button>
      <nav id="site-nav" class="nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="diseases.html">Disease Library</a>
        <a href="education.html">Education</a>
        <a href="safety.html">Safety</a>
        <a href="about.html">About</a>
      </nav>
      <div class="topbar-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"><span class="icon theme-icon" data-icon="sun"></span></button>
        <a class="btn btn-primary btn-sm header-btn" href="diagnose.html">
          Start Diagnosis
        </a>
      </div>
    </div>
  </header>

  <main id="main-content" class="section page-shell">
    <div class="container stack page-stack">
      <div class="section-head page-head reveal reveal-up">
        <h1><span class="icon" data-icon="history"></span>Full Analysis History</h1>
        <p>Filter and manage stored backend predictions for audit and teaching review.</p>
      </div>
      <div class="card reveal reveal-up">
        <div class="history-filters">
          <label for="history-filter">Filter by class:</label>
          <select id="history-filter"><option value="all">All</option></select>
          <button id="clear-all-history" class="btn btn-ghost" type="button">Clear All</button>
        </div>
        <div id="history-full" class="history-grid"></div>
      </div>
    </div>
  </main>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top"><span class="icon" data-icon="chevron"></span></button>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <footer class="footer"><div class="container"><p>Educational platform interface only. Not a substitute for licensed medical diagnosis.</p></div></footer>
</body>
</html>
